name: Archivist
services:
  llm:
    build:
      context: AI/
      dockerfile: Dockerfile
    container_name: llm-model
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    gpus: all
  
  llm-service:
    build:
      context: AI-service/
      dockerfile: Dockerfile
    
    container_name: llm_service
    ports:
      - "8001:8000"
    depends_on:
      llm:
        condition: service_started
    volumes:
      - ./.env:/app/.env
    
  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_started

  database:
    image: postgres:17-alpine
    container_name: archivist_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - archivist_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5
  
  redis:
    container_name: archivist-redis
    image: docker.io/valkey/valkey:9.1-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - archivist_valkey_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

    ports:
      - "${REDIS_PORT}:6379"

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  model:
  archivist_db:
  archivist_valkey_data:
  ollama: